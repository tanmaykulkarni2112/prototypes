global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: "go_metrics"
    static_configs:
    # since the application go file is not running as a container, 
    # we need to use the host machine's IP address to access the metrics endpoint. 
    # In this case, we can use the default gateway IP address for Docker, which is typically
      - targets: ["172.17.0.1:2112"]